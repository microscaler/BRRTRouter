# BRRTRouter Clippy Configuration
#
# JSF Rule 206 Compliance: "No heap allocations after initialization"
#
# Hot path modules (router, dispatcher, server/request) have module-level
# #![deny(...)] attributes for allocation-related lints. This file provides
# project-wide configuration.

# Warn on large stack allocations (might indicate need for arena allocation)
# Most request data should fit within these bounds
stack-size-threshold = 512000

# Allow reasonable enum variant size differences for pattern matching
# (routing enums may have different-sized variants)
enum-variant-size-threshold = 256

# Type complexity threshold for hot path types
type-complexity-threshold = 300

# Cognitive complexity threshold (JSF: functions should be simple)
cognitive-complexity-threshold = 30

# Documentation requirements
missing-docs-in-crate-items = false

# Allow reasonable function argument counts for handlers
too-many-arguments-threshold = 8

# Struct field threshold
too-many-lines-threshold = 200

# Single char binding names allowed in closures
single-char-binding-names-threshold = 4


# ---------------------------------------------------------------------------
# No OS-blocking calls on the may runtime.
#
# Handlers run as coroutines on may's worker threads. Each call below blocks the worker thread in
# the kernel instead of parking the coroutine, so every coroutine queued on that worker stalls
# behind it (see src/runtime_watchdog.rs and src/net.rs). Use may::net, may::sync,
# may::coroutine::sleep, brrtrouter::net::{resolve, connect} and brrtrouter::http::fetch_* instead.
# Code that genuinely runs on its own OS thread (never on a may worker) may opt out with
# `#[allow(clippy::disallowed_methods, clippy::disallowed_types)]` and a comment saying which
# thread it runs on. CI denies these two lints.
# ---------------------------------------------------------------------------
disallowed-types = [
    { path = "std::net::TcpStream", reason = "blocks the may worker thread; use may::net::TcpStream or brrtrouter::net::connect" },
    { path = "std::sync::Condvar", reason = "parks the may worker thread; use may::sync::Condvar" },
    { path = "std::sync::mpsc::Receiver", reason = "recv parks the may worker thread; use may::sync::mpsc" },
]
disallowed-methods = [
    { path = "std::thread::scope", reason = "joining parks the may worker until every scoped thread ends; receive results on a may channel or run the work on coroutines" },
    { path = "std::thread::JoinHandle::join", reason = "parks the may worker thread; wait on a may channel or join a coroutine" },
    { path = "std::thread::ScopedJoinHandle::join", reason = "parks the may worker thread; wait on a may channel or join a coroutine" },
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "getaddrinfo blocks the may worker thread; use brrtrouter::net::resolve" },
    { path = "std::net::TcpStream::connect", reason = "blocks the may worker thread; use brrtrouter::net::connect" },
    { path = "std::net::TcpStream::connect_timeout", reason = "blocks the may worker thread; use brrtrouter::net::connect" },
    { path = "std::thread::sleep", reason = "parks the may worker thread; use may::coroutine::sleep" },
]
