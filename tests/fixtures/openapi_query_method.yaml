        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - q
              properties:
                q:
                  type: string
                limit:
                  type: integer
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                q:
                  type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items:
