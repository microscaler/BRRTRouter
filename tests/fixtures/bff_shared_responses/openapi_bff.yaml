openapi: 3.1.0
info:
  title: Catalog API Gateway
  description: 'System-level API gateway for all Catalog services. This aggregates and proxies requests to Catalog microservices.
    Single entry point for the Catalog system.


    All requests proxied to sub-services:

    - `/api/v1/catalog/gadgets/*` → Gadgets Service

    - `/api/v1/catalog/widgets/*` → Widgets Service


    **Note**: Auto-generated. Do not edit manually.


    **Discovery**: openapi/catalog/'
  version: 1.0.0
servers:
- url: /api/v1/catalog
  description: Catalog API Gateway
tags: []
