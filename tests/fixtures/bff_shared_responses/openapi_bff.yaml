        $ref: '#/components/schemas/GadgetsGadgetId'
    get:
      operationId: get_gadgets
      tags:
      - gadgets
      responses:
        '200':
          description: One gadgets item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GadgetsGadget'
        '404':
