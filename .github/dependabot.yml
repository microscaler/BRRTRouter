# Dependabot configuration for BRRTRouter
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Rust/Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "rust"
    # Group minor/patch updates to reduce PR noise
    groups:
      # Same group, patterns and Monday 09:00 UTC slot in every Microscaler Rust repo: the crates they all compile
      # move to the same versions in the same week, which is what lets the shared sccache on the ms02 CI runners hit
      # across repos. Majors still arrive one PR each.
      shared-stack:
        patterns: ["tokio*", "serde*", "hyper*", "http-body*", "tower*", "tracing*", "opentelemetry*", "prost*",
                   "tonic*", "rustls*", "ring", "aws-lc*", "cc", "openssl*", "reqwest*", "chrono*", "uuid", "anyhow",
                   "thiserror*", "clap*", "jsonwebtoken", "redis*", "futures*", "bytes", "regex*", "syn", "quote",
                   "proc-macro2", "rand*", "base64", "sha2", "hmac", "ed25519*", "time", "url", "once_cell",
                   "parking_lot*", "dashmap", "smallvec", "itoa", "memchr", "hashbrown", "indexmap", "pyroscope*"]
        update-types: ["minor", "patch"]
      rust-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Exclude our forks - these are manually managed
    ignore:
      # Our fork with configurable max headers
      - dependency-name: "may_minihttp"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # Our fork with Rust 1.90+ thread-local fix
      - dependency-name: "generator"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # May uses our patched generator - updates could break compatibility
      - dependency-name: "may"
        update-types: ["version-update:semver-major"]
      # Our fork with Rust 1.90+ thread-local fix
      - dependency-name: "http"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"

  # Python dependencies in tooling directory
  - package-ecosystem: "pip"
    directory: "/tooling"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(tooling)"
    labels:
      - "dependencies"
      - "python"
      - "tooling"
    # Group minor/patch updates to reduce PR noise
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

