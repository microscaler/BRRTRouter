name: Octopilot CI

# Generic Octopilot pipeline (detect → lint → test → validate → artifacts).
# The application shape is auto-detected from skaffold.yaml: one rust context
# at the repo root building the pet_store example via the octopilot/rust
# buildpack. integration: false — BRRTRouter has no Helm chart / k8s overlay
# yet, so the Kind + Flux deploy stage is skipped; images are still built and
# pushed to ttl.sh for verification.
#
# The pre-existing ci.yml continues to run the exhaustive repo-native test
# suite; this workflow proves the octopilot meta-build path.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref: a new push cancels the previous in-flight run so builds
# never stack up. Tag runs are NEVER cancelled — releases always complete.
concurrency:
  group: octopilot-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Octopilot
    # The pipeline's jobs request these; a caller that grants less fails at startup. id-token: write lets the
    # integration and release jobs log in to a private registry through Workload Identity Federation.
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write
      # write: trim-artifacts deletes old run artifacts before uploading (read only, 915 refused deletes ran Detect past
      # its limit); acceptance-promote downloads this run's build results (octopilot/actions#16).
      actions: write
    uses: octopilot/actions/.github/workflows/pipeline.yml@main
    with:
      # v1.2.2: a tagged op that takes --artifact-key and forwards the shared sccache (OP_SCCACHE).
      op_version: v1.2.2
      # Public repository: pull requests (forks included) run on GitHub-hosted runners; push, tag and dispatch runs use
      # the ms02 ARC runners and their shared Rust compile cache. Outside contributors' runs need approval (repository
      # setting). Push runs upload the pet_store image to ttl.sh over ms02's 12 Mbit/s uplink.
      runner: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || '["self-hosted", "linux", "x64", "microscaler"]' }}
      sccache: ${{ github.event_name != 'pull_request' }}
      # Image build and push on GitHub-hosted runners: pushes from ms02 share its ~15 Mbit/s uplink with
      # PriceWhisperer's releases.
      artifacts_runner: ubuntu-24.04
      integration: false
    # Pass explicitly (not `inherit`): inherit does not reliably cross the
    # org boundary to octopilot/actions.
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
