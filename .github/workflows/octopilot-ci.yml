name: Octopilot CI

# Generic Octopilot pipeline (detect → lint → test → validate → artifacts).
# The application shape is auto-detected from skaffold.yaml: one rust context
# at the repo root building the pet_store example via the octopilot/rust
# buildpack. integration: false — BRRTRouter has no Helm chart / k8s overlay
# yet, so the Kind + Flux deploy stage is skipped; images are still built and
# pushed to ttl.sh for verification.
#
# The pre-existing ci.yml continues to run the exhaustive repo-native test
# suite; this workflow proves the octopilot meta-build path.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref: a new push cancels the previous in-flight run so builds
# never stack up. Tag runs are NEVER cancelled — releases always complete.
concurrency:
  group: octopilot-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Octopilot
    # The pipeline's jobs request these; a caller that grants less fails at startup. id-token: write lets the
    # integration and release jobs log in to a private registry through Workload Identity Federation.
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write
    uses: octopilot/actions/.github/workflows/pipeline.yml@main
    with:
      integration: false
    # Pass explicitly (not `inherit`): inherit does not reliably cross the
    # org boundary to octopilot/actions.
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
